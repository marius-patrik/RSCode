name: Verify

on:
  push:
    branches: ["main", "pmarius/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - name: Preserve visual smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canvas-visual-smoke
          path: dist/visual-smoke/*.png
          if-no-files-found: ignore
