name: RSCode native distribution acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/native-distribution.yml"
      - "scripts/distribution/**"
      - "src/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "rsbuild.config.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rscode-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run verify

  native-distribution:
    name: ${{ matrix.name }}
    needs: original-verification
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-24.04
            expected_platform: linux
            expected_arch: x64
          - name: windows-x64
            runner: windows-2025
            expected_platform: win32
            expected_arch: x64
          - name: macos-arm64
            runner: macos-15
            expected_platform: darwin
            expected_arch: arm64
          - name: macos-x64
            runner: macos-15-intel
            expected_platform: darwin
            expected_arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/out/browser-cache
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify host architecture
        shell: bash
        run: |
          bun -e 'if(process.platform !== "${{ matrix.expected_platform }}" || process.arch !== "${{ matrix.expected_arch }}") throw new Error("unexpected native runner architecture: "+process.platform+" "+process.arch)'
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Provision native Chromium
        run: bunx playwright install chromium
      - name: Provision Linux Chromium system libraries
        if: matrix.expected_platform == 'linux'
        run: bunx playwright install-deps chromium
      - name: Build web and native payload
        shell: bash
        run: |
          bun run build:web
          bun scripts/distribution/build.ts
      - name: Archive reproducibly and produce SHA-256
        run: python3 scripts/distribution/archive.py
      - name: Extract outside checkout and exercise real distribution
        run: python3 scripts/distribution/accept.py
      - name: Upload unsigned portable preview and acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rscode-native-${{ matrix.name }}-${{ github.sha }}
          path: |
            out/native/*.tar.gz
            out/native/*.zip
            out/native/*.sha256
            out/native/reports/*.json
          if-no-files-found: warn
          retention-days: 14
