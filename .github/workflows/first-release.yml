name: First Canvas preview release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canvas-v0.1.0-first-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check initial version and tag
        id: version
        run: |
          set -euo pipefail
          actual="$(node -p 'JSON.parse(require("fs").readFileSync("package.json","utf8")).version')"
          test "$actual" = "0.1.0"
          git fetch --tags --quiet
          if git show-ref --tags --verify --quiet refs/tags/v0.1.0; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: oven-sh/setup-bun@v2
        if: steps.version.outputs.skip != 'true'
        with:
          bun-version: 1.3.11
      - name: Install frozen dependencies
        if: steps.version.outputs.skip != 'true'
        run: bun install --frozen-lockfile
      - name: Verify complete application
        if: steps.version.outputs.skip != 'true'
        run: bun run verify
      - name: Package source and web bundle
        if: steps.version.outputs.skip != 'true'
        run: |
          set -euo pipefail
          mkdir -p out/canvas-v0.1.0/dist
          cp package.json bun.lock rsbuild.config.ts tsconfig.json biome.json out/canvas-v0.1.0/
          cp -R docs scripts src out/canvas-v0.1.0/
          cp -R dist/web out/canvas-v0.1.0/dist/
          tar -czf canvas-v0.1.0-source-web.tar.gz -C out canvas-v0.1.0
          tar -tzf canvas-v0.1.0-source-web.tar.gz | grep -q 'canvas-v0.1.0/dist/web/index.html'
      - name: Publish immutable initial preview
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.1.0 canvas-v0.1.0-source-web.tar.gz \
            --target "$GITHUB_SHA" \
            --title "Canvas v0.1.0 — local preview" \
            --notes-file docs/RELEASE_NOTES.md \
            --prerelease
      - name: Preserve release smoke screenshots
        if: always() && steps.version.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: canvas-release-visual-smoke
          path: dist/visual-smoke/*.png
          if-no-files-found: ignore
